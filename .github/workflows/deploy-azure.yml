name: Deploy to Azure App Service

# ─── Trigger: Push auf main oder manueller Start ─────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─── Globale Umgebungsvariablen ──────────────────────────────────────
env:
  AZURE_WEBAPP_NAME: mali-notiz-api-c3        # Wird in Faz 2 gesetzt
  NODE_VERSION: '22.x'

# ─── Concurrency: Nur ein Deployment gleichzeitig ────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Job 1: Build — Abhängigkeiten installieren und Artefakt erstellen
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Production Dependencies
        run: npm ci --omit=dev

      - name: Create Deployment Artifact (ZIP)
        run: |
          zip -r release.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "docs/*" \
            -x "*.md" \
            -x ".env*"

      - name: Upload Artifact for Deploy Job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  # ═══════════════════════════════════════════════════════════════════
  # Job 2: Deploy — Artefakt auf Azure App Service deployen
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
